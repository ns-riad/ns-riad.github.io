# Certificates — shown in the gallery on /awards/.
#
# HOW IT WORKS
#   Drop a PDF or image into  assets/certificates/<category>/  and it appears automatically.
#   The sub-folder decides the filter tab, e.g.
#       assets/certificates/ml-ai/deep-learning-specialization.pdf
#   A preview image is generated from the PDF's first page at build time.
#   Without any entry below, the title is the file name ("deep-learning-specialization" → "Deep learning specialization").
#
# OPTIONAL DETAILS
#   Add an entry under `items:` using the file name WITHOUT extension as the key.
#   An entry whose file doesn't exist yet is listed as text under "Also completed",
#   and moves into the gallery as soon as you add the file.

# "Also completed" section: lists items below that have no file yet. true = show, false = hide.
show_also_completed: false

# Order = priority. Tabs and the gallery ("All") follow the order of `categories:` below,
# newest first inside each group. Move a line up or down to change the priority.
# `rank:` on an item (lower = earlier, default 50) pins it within its group.
# A tab only appears once its folder has at least one file. "All" always comes first.
#
#   assets/certificates/
#   ├── honors/ ........ Honors & Awards     also listed at the top of the page
#   ├── research/ ...... Research & Service  presentations, peer review, CITI
#   ├── ml-ai/ ......... ML & AI             deep learning, data science courses
#   ├── programming/ ... Programming         languages, tools
#   ├── others/ ........ Others              CTL, general courses, anything else
#   └── memberships/ ... Memberships         IEEE, IEEE ITSS, …
categories:
  honors: Honors & Awards
  research: Research & Service
  ml-ai: ML & AI
  programming: Programming
  others: Others
  memberships: Memberships

