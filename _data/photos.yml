# Photography — OPTIONAL details for the photos in assets/photography/.
#
# You don't need to touch this file: any image you drop into assets/photography/ shows up on
# /photography/ automatically (title = file name), with its own page at /photography/<file-name>/.
# Camera/lens/exposure are read from the photo itself; GPS and other metadata are stripped from
# what gets published.
#
# Big files? Run  scripts/optimize_photos.sh  before committing (keeps the repo small).
#
# To add details, use the file name WITHOUT extension as the key:
#
#   items:
  oconaluftee-forest-stream:
    title: Forest stream
    place: Oconaluftee Visitor Center, North Carolina
    caption: A quiet stream through the woods at the edge of the Great Smoky Mountains, near the Oconaluftee Visitor Center.

  cane-creek-falls-bridge:
    title: The long bridge
    place: Cane Creek Falls, Fall Creek Falls State Park, Tennessee
    caption: The suspension bridge above Cane Creek Falls, one of the trails in Fall Creek Falls State Park.

  smoky-mountains-ridges:
    title: Ridges under a summer sky
    place: Great Smoky Mountains
    caption: Layer after layer of blue ridges, the view that gives the Smoky Mountains their name.
